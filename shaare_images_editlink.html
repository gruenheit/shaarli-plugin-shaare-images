<div class="shaare-images-entry">
    <button type="button" id="shaare-images-btn" class="shaare-images-icon-btn"
        data-width-small="%1$d" data-width-large="%2$d" data-i18n="%3$s" title="%4$s" aria-label="%4$s">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="2.5" y="4.5" width="19" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="8" cy="10" r="1.8" fill="currentColor"/>
            <path d="M4 17.5 L9.5 12 L13.5 15.5 L16.5 12.5 L20 17.5 Z" fill="currentColor"/>
        </svg>
    </button>
</div>

<dialog id="shaare-images-dialog">
    <div id="shaare-images-form">
        <h3>%4$s</h3>

        <label for="shaare-images-url">%5$s</label>
        <input type="url" id="shaare-images-url" placeholder="https://...">
        <p id="shaare-images-status" class="shaare-images-status"></p>

        <details class="shaare-images-help">
            <summary>%13$s</summary>
            <p>%14$s</p>
            <p>%15$s</p>
            <p>%16$s</p>
        </details>

        <label for="shaare-images-alt">%6$s</label>
        <input type="text" id="shaare-images-alt" placeholder="%7$s">

        <fieldset class="shaare-images-size">
            <legend>%8$s</legend>
            <label><input type="radio" name="shaare-images-size" value="small" checked> %9$s</label>
            <label><input type="radio" name="shaare-images-size" value="large"> %10$s</label>
        </fieldset>

        <div class="shaare-images-actions">
            <button type="button" id="shaare-images-cancel">%11$s</button>
            <button type="button" id="shaare-images-insert" disabled>%12$s</button>
        </div>
    </div>
</dialog>
